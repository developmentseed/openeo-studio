replicaCount: 1

image:
  repository: ghcr.io/developmentseed/openeo-studio
  # Defaults to Chart.appVersion when empty
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: openeo-studio.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

env:
  OPENEO_API_URL: https://api.explorer.eopf.copernicus.eu/openeo
  # The container derives its mount path from this URL (see
  # docker/90-app-config.sh) - there is no separate PATH_PREFIX variable.
  BASE_URL: ""
  APP_TITLE: openEO Studio
  APP_DESCRIPTION: Interactive code editor for openEO satellite imagery processing
  MAPTILER_KEY: ""
  # Optional login overrides. When empty, the app uses
  # GET {OPENEO_API_URL}/credentials/oidc from the openEO backend.
  AUTH_AUTHORITY: ""
  AUTH_CLIENT_ID: ""
  AUTH_REDIRECT_URI: ""
  ENABLE_NARRATIVE_EXPORT: "false"
  PARTNER_LOGO_URL: ""

# Base map layers for the map viewer, rendered into the BASEMAPS env var as
# JSON. Each entry needs a `label` and a `light` and/or `dark` URL (one URL is
# used for both modes). A URL is a MapLibre style URL, or a raster tile URL
# template when it contains `{z}`. `attribution` and `maxzoom` are optional and
# apply to tile URLs. When empty, the app uses MapTiler (if MAPTILER_KEY is set)
# or free base maps that need no key.
#
# basemaps:
#   - label: Streets
#     light: https://tiles.openfreemap.org/styles/positron
#     dark: https://tiles.openfreemap.org/styles/dark
#   - label: OpenStreetMap
#     light: https://tile.openstreetmap.org/{z}/{x}/{y}.png
#     attribution: "&copy; OpenStreetMap contributors"
basemaps: []

# Source any of the above env vars from a pre-existing Secret instead of a
# literal value in `env`. A name listed here takes over from `env` entirely
# (its literal value, if any, is dropped in favor of the secretKeyRef).
# secretKey defaults to `name` when omitted.
#
# envFromSecret:
#   - name: MAPTILER_KEY
#     secretName: openeo-studio-secrets
#     secretKey: maptiler-key
envFromSecret: []

nodeSelector: {}
tolerations: []
affinity: {}
