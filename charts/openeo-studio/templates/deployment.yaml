apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openeo-studio.fullname" . }}
  labels:
    {{- include "openeo-studio.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "openeo-studio.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openeo-studio.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ toJson (dict "env" .Values.env "envFromSecret" .Values.envFromSecret) | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: openeo-studio
          image: {{ include "openeo-studio.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            {{- $secretKeys := list }}
            {{- range .Values.envFromSecret }}
            {{- $secretKeys = append $secretKeys .name }}
            {{- end }}
            {{- range $key, $value := .Values.env }}
            {{- if not (has $key $secretKeys) }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- range .Values.envFromSecret }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .secretKey | default .name }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
