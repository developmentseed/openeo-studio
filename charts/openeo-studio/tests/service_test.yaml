suite: service

templates:
  - templates/service.yaml

tests:
  - it: defaults to a ClusterIP service on port 80
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 80
      - equal:
          path: spec.ports[0].targetPort
          value: http

  - it: honors service.type and service.port overrides
    set:
      service.type: LoadBalancer
      service.port: 8080
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer
      - equal:
          path: spec.ports[0].port
          value: 8080

  - it: selects pods by the chart's selector labels
    asserts:
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: openeo-studio
            app.kubernetes.io/instance: RELEASE-NAME
