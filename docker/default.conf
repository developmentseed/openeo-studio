server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    gzip on;
    gzip_types text/plain text/markdown text/css application/javascript application/json image/svg+xml;

    # Written at container start by 90-app-config.sh.
    include /tmp/openeo-studio/path-prefix.inc;

    location = /index.html {
        root /tmp/openeo-studio;
        add_header Cache-Control "no-cache" always;
    }

    # Documents for agents, templated at container start by 90-app-config.sh.
    location ~ ^/(llms\.txt|llms-full\.txt|agents/[a-z-]+\.md)$ {
        root /tmp/openeo-studio;
        types { }
        default_type text/markdown;
        charset utf-8;
        charset_types text/markdown;
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location = /.well-known/openeo-studio.json {
        root /tmp/openeo-studio;
        add_header Cache-Control "no-cache" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location /agents/ {
        add_header Access-Control-Allow-Origin "*" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
